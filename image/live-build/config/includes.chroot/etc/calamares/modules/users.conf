---
# AIRUX: new users join "aira" so AIRA's polkit rule applies to them (AIRA still asks first).
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - lpadmin
    - audio
    - sudo
    - netdev
    - plugdev
    - name: aira
      must_exist: false
      system: true
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
setRootPassword: false
doReusePassword: true
passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
  forbidden_names: [ root, aira ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "airux"
