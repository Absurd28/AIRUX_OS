<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIRUX Snake</title>
<style>
  :root {
    --bg: #0b1016; --panel: #121a23; --board: #0f161e; --grid: #16202b; --line: #223040;
    --text: #e6e9ee; --muted: #8b95a3; --blue: #7cc4ff; --green: #59c38a; --food: #ff8a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: Inter, "DejaVu Sans", system-ui, sans-serif; user-select: none; overflow: hidden; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  header { width: min(100%, 672px); display: flex; align-items: center; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: .5px; }
  .brand svg { width: 30px; height: 30px; }
  .stats { margin-left: auto; display: flex; gap: 8px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
    font-size: 13px; color: var(--muted); white-space: nowrap; }
  .chip b { color: var(--text); font-variant-numeric: tabular-nums; margin-left: 4px; }
  .stage { position: relative; width: min(100%, 672px); aspect-ratio: 672 / 504; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 16px; background: var(--board);
    box-shadow: 0 0 0 1px var(--line), 0 18px 40px rgba(0,0,0,.45); }
  .stage.walls canvas { box-shadow: 0 0 0 2px #2c4a5e, 0 0 24px rgba(124,196,255,.12), 0 18px 40px rgba(0,0,0,.45); }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; border-radius: 16px; background: rgba(11,16,22,.78); backdrop-filter: blur(3px); text-align: center; padding: 20px; }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: 34px; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--blue), var(--green)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .row { display: flex; gap: 10px; align-items: center; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--blue); outline: none; }
  button.primary { background: linear-gradient(90deg, #2f6f9c, #2f8a5f); border-color: transparent; font-weight: 600; padding: 10px 26px; }
  .seg button[aria-pressed="true"] { border-color: var(--green); color: #fff; background: #17302a; }
  .speed { display: flex; gap: 4px; }
  .speed button { width: 38px; padding: 8px 0; }
  .speed button[aria-pressed="true"] { border-color: var(--blue); background: #172a3a; }
  kbd { font: 12px/1 "JetBrains Mono", monospace; background: var(--panel); border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 6px; padding: 3px 6px; color: var(--text); }
  .score-big { font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .new-best { color: var(--green); font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#59c38a"/></linearGradient></defs>
        <rect x="2" y="2" width="60" height="60" rx="16" fill="#121a23" stroke="#223040"/>
        <path d="M14 40 C 14 28, 26 28, 32 34 S 50 40, 50 26" fill="none" stroke="url(#lg)" stroke-width="7" stroke-linecap="round"/>
        <circle cx="50" cy="22" r="3" fill="#ff8a7a"/></svg>
      AIRUX Snake
    </div>
    <div class="stats">
      <span class="chip">Score<b id="score">0</b></span>
      <span class="chip">Best<b id="best">0</b></span>
      <span class="chip" id="info">Walls · 3</span>
    </div>
  </header>
  <div class="stage walls" id="stage">
    <canvas id="board" width="1344" height="1008" aria-label="Snake board"></canvas>
    <div class="overlay" id="start">
      <h1>AIRUX Snake</h1>
      <p>Eat the glowing dots, grow longer, and don't run into yourself.</p>
      <div class="row seg" role="group" aria-label="Mode">
        <button id="m-walls" aria-pressed="true">Walls</button>
        <button id="m-wrap" aria-pressed="false">Wrap around</button>
      </div>
      <div class="row"><span style="color:var(--muted);font-size:13px">Speed</span>
        <div class="speed" id="speeds"></div></div>
      <button class="primary" id="play">Play</button>
      <p><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
        or the keypad <kbd>2</kbd><kbd>4</kbd><kbd>6</kbd><kbd>8</kbd> to steer · <kbd>P</kbd> pause · <kbd>M</kbd> mode ·
        <kbd>1</kbd>–<kbd>5</kbd> speed · <kbd>Enter</kbd> play</p>
    </div>
    <div class="overlay" id="paused" hidden>
      <h1>Paused</h1>
      <p>Press <kbd>P</kbd>, <kbd>Space</kbd> or <kbd>Esc</kbd> to carry on.</p>
    </div>
    <div class="overlay" id="over" hidden>
      <h1 id="over-title">Game over</h1>
      <div class="score-big" id="final">0</div>
      <p id="over-note"></p>
      <div class="row"><button class="primary" id="again">Play again</button><button id="menu">Settings</button></div>
      <p><kbd>Enter</kbd> play again · <kbd>Esc</kbd> settings</p>
    </div>
  </div>
</main>
<script src="snake-core.js"></script>
<script>
"use strict";
const S = window.SnakeCore;
const COLS = 24, ROWS = 18;
const cv = document.getElementById("board"), ctx = cv.getContext("2d");
const CELL = cv.width / COLS;
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
};
let settings = Object.assign({ mode: "walls", speed: 3 }, store.get("airux-snake-settings", {}));
let game = null, state = "start", timer = null, lastFrame = 0, flash = 0;

const bestKey = () => `airux-snake-best-${settings.mode}-${settings.speed}`;
function showStats() {
  $("score").textContent = game ? game.score : 0;
  $("best").textContent = store.get(bestKey(), 0);
  $("info").textContent = `${settings.mode === "walls" ? "Walls" : "Wrap"} · speed ${settings.speed}`;
  $("stage").classList.toggle("walls", settings.mode === "walls");
}
function renderSettings() {
  $("m-walls").setAttribute("aria-pressed", settings.mode === "walls");
  $("m-wrap").setAttribute("aria-pressed", settings.mode === "wrap");
  const box = $("speeds"); box.textContent = "";
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement("button"); b.textContent = i; b.setAttribute("aria-pressed", settings.speed === i);
    b.onclick = () => setSpeed(i); box.appendChild(b);
  }
  store.set("airux-snake-settings", settings);
  showStats();
}
function setSpeed(n) { settings.speed = Math.min(5, Math.max(1, n)); renderSettings(); }
function setMode(m) { settings.mode = m; renderSettings(); }
function overlay(name) { for (const id of ["start", "paused", "over"]) $(id).hidden = id !== name; }

function start() {
  game = S.createGame({ cols: COLS, rows: ROWS, mode: settings.mode, speed: settings.speed });
  state = "playing"; overlay(null); showStats(); schedule();
}
function schedule() { clearInterval(timer); timer = setInterval(tick, S.interval(game)); }
function tick() {
  if (state !== "playing") return;
  const r = S.step(game);
  if (r === "ate") flash = 1;
  if (r === "crashed" || r === "won") end(r === "won");
  showStats();
}
function end(won) {
  state = "over"; clearInterval(timer);
  const best = store.get(bestKey(), 0), isBest = game.score > best;
  if (isBest) store.set(bestKey(), game.score);
  $("over-title").textContent = won ? "You filled the board!" : "Game over";
  $("final").textContent = game.score;
  $("over-note").innerHTML = isBest && game.score > 0 ? '<span class="new-best">New best score!</span>'
    : `Length ${game.snake.length} · best ${Math.max(best, game.score)}`;
  overlay("over"); showStats();
}
function pause(on) {
  if (state === "playing" && on) { state = "paused"; overlay("paused"); }
  else if (state === "paused" && !on) { state = "playing"; overlay(null); }
}

const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right",
  8: "up", 2: "down", 4: "left", 6: "right" };
document.addEventListener("keydown", (e) => {
  const k = e.key;
  if (state === "playing") {
    if (KEYS[k]) { S.turn(game, KEYS[k]); e.preventDefault(); return; }
    if (k === "p" || k === "P" || k === " " || k === "Escape") { pause(true); e.preventDefault(); }
    return;
  }
  if (state === "paused") { if (k === "p" || k === "P" || k === " " || k === "Escape") pause(false); return; }
  if (state === "over") {
    if (k === "Enter" || k === " ") start();
    else if (k === "Escape") { state = "start"; overlay("start"); }
    return;
  }
  // start screen
  if (k === "Enter" || k === " ") start();
  else if (k === "m" || k === "M") setMode(settings.mode === "walls" ? "wrap" : "walls");
  else if (/^[1-5]$/.test(k)) setSpeed(+k);
  else if (k === "ArrowLeft" || k === "-") setSpeed(settings.speed - 1);
  else if (k === "ArrowRight" || k === "+" || k === "=") setSpeed(settings.speed + 1);
});
// pointer: swipe on the board to steer (touchscreens)
let touch = null;
cv.addEventListener("pointerdown", (e) => { touch = { x: e.clientX, y: e.clientY }; });
cv.addEventListener("pointerup", (e) => {
  if (!touch || state !== "playing") return;
  const dx = e.clientX - touch.x, dy = e.clientY - touch.y; touch = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  S.turn(game, Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
});
$("play").onclick = start; $("again").onclick = start;
$("menu").onclick = () => { state = "start"; overlay("start"); };
$("m-walls").onclick = () => setMode("walls"); $("m-wrap").onclick = () => setMode("wrap");
window.addEventListener("blur", () => pause(true));

// ------------------------------------------------------------------ drawing
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function mix(a, b, t) {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",")})`;
}
function draw(now) {
  const t = now / 1000;
  ctx.fillStyle = "#0f161e"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = "#141d27";
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if ((x + y) % 2 === 0) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
  const g = game || S.createGame({ cols: COLS, rows: ROWS, random: S.rng(5) });
  if (g.food) {   // food: a softly pulsing dot
    const cx = (g.food.x + 0.5) * CELL, cy = (g.food.y + 0.5) * CELL, r = CELL * (0.26 + 0.04 * Math.sin(t * 5));
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, CELL * 0.9);
    glow.addColorStop(0, "rgba(255,138,122,.45)"); glow.addColorStop(1, "rgba(255,138,122,0)");
    ctx.fillStyle = glow; ctx.fillRect(cx - CELL, cy - CELL, CELL * 2, CELL * 2);
    ctx.fillStyle = "#ff8a7a"; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  }
  const n = g.snake.length;
  for (let i = n - 1; i >= 0; i--) {   // body from tail to head, blue at the head to green at the tail
    const p = g.snake[i], pad = i === 0 ? CELL * 0.04 : CELL * (0.06 + 0.08 * (i / n));   // tapers to the tail
    ctx.fillStyle = mix("#7cc4ff", "#59c38a", n > 1 ? i / (n - 1) : 0);
    roundRect(p.x * CELL + pad, p.y * CELL + pad, CELL - 2 * pad, CELL - 2 * pad, CELL * 0.3); ctx.fill();
  }
  const h = g.snake[0], d = S.DIRS[g.dir];   // eyes look where the snake is going
  for (const s of [-1, 1]) {
    const ex = (h.x + 0.5 + d.x * 0.18 + -d.y * 0.2 * s) * CELL, ey = (h.y + 0.5 + d.y * 0.18 + d.x * 0.2 * s) * CELL;
    ctx.fillStyle = "#0b1016"; ctx.beginPath(); ctx.arc(ex, ey, CELL * 0.09, 0, Math.PI * 2); ctx.fill();
  }
  if (flash > 0) { ctx.fillStyle = `rgba(89,195,138,${flash * 0.12})`; ctx.fillRect(0, 0, cv.width, cv.height); flash = Math.max(0, flash - 0.08); }
  requestAnimationFrame(draw);
}
renderSettings();
requestAnimationFrame(draw);
</script>
</body>
</html>
