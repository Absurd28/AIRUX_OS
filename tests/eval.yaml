# Phase 9 evaluation: 200 commands. None of them appear in tests/commands.yaml or tests/traps.yaml.
# Run with tests/eval.py, which builds the fixture home (tests/fixture.py plus the extras listed in
# eval.py) and denies every confirmation.
#
# kind: tool    the routed agent's first tool call must match. agent and tool may be lists of
#               equally right answers. args matchers: equals, contains (case-insensitive), path.
#               risky: true means the broker must ask (and, denied, the handler must not run).
# kind: multi   every listed agent is routed, and each one's first call is the listed tool.
# kind: trap    missing item, unknowable fact, no memory behind it, failing tool or ambiguous
#               request: no action on a missing item, no state change, no "done" without
#               read-back, and the reply is a question or "I'm not sure" / "I couldn't verify that".
# kind: chat    greeting, thanks, about, small talk or a voice change: no tools run;
#               contains: text the reply must include.

