# Phase 3 check: 50 traps. Each names something missing, hits a failing tool, or asks something no
# tool can know. Every one must end in a question or "I'm not sure" / "I couldn't verify that",
# no action may touch a missing item, and nothing may be called done without a read-back.
# missing: strings that must not appear in the arguments of any executed call.
# Fixture home: notes/{lab-notes.md, ideas.txt}, data/results.csv (3 data rows), Documents/report.txt,
# old.log, projects/demo (git repo), envs/ (empty). No podman, no clipboard tool, no GUI apps.

