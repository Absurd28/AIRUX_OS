<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="AIRUX: a Debian-based OS with AIRA, a local voice assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#121c27"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#59c38a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6e9ee"/>
      <stop offset="0.5" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#e6e9ee"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bar { fill: url(#wave); transform-box: fill-box; transform-origin: center; animation: talk 1.4s ease-in-out infinite; }
      @keyframes talk { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
      .sub { font: 400 22px 'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif; fill: #8b95a3; letter-spacing: 1px; }
      .tag { font: 600 15px 'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif; fill: #c9d1d9; letter-spacing: 2px; }
      .dot { fill: #59c38a; animation: blink 2s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    </style>

    <linearGradient id="axl-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2532"/><stop offset="1" stop-color="#0b1016"/>
    </linearGradient>
    <linearGradient id="axl-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#59c38a"/>
    </linearGradient>
    <linearGradient id="axl-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d4f3e2"/>
    </linearGradient>
    <radialGradient id="axl-glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity="0.22"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="24" fill="none" stroke="#2b3644" stroke-width="2"/>
  <circle cx="190" cy="170" r="150" fill="url(#glow)"/>

  <!-- the AIRUX logo: an "A" whose crossbar is AIRA's voice wave -->
  <g transform="translate(66 46) scale(0.97)">
<rect x="8" y="8" width="240" height="240" rx="56" fill="url(#axl-tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#axl-glow)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#2b3a4b" stroke-width="3"/>
  <!-- the A's two legs -->
  <path d="M60 206 L128 46 L196 206" fill="none" stroke="url(#axl-ink)" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the crossbar: AIRA's voice wave -->
  <path d="M85 148 C 94 148, 96 128, 106.5 128 S 118 168, 128 168 S 139.5 128, 149.5 128 S 162 148, 171 148"
        fill="none" stroke="url(#axl-wave)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="380" y="168" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="96"
        font-weight="800" letter-spacing="12" fill="url(#title)">AIRUX</text>
  <text class="sub" x="384" y="214">The Linux OS with a voice assistant that won't make things up</text>
  <circle class="dot" cx="392" cy="262" r="6"/>
  <text class="tag" x="408" y="267">DEBIAN 13 · LOCAL LLM · VOICE · GROUNDED · PRIVATE BY DESIGN</text>
</svg>
